<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game of 15 - Interactive Case Study</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <header>
      <h1>The Game of 15</h1>
      <div class="stats-panel">
        <div>Moves: <span id="move-count">0</span></div>
        <div>Status: <span id="game-status">In Progress</span></div>
      </div>
    </header>

    <div id="board" class="board" role="grid" aria-label="15 Puzzle Board"></div>

    <section class="controls">
      <button id="shuffle-btn" type="button">New Solvable Game</button>
      <button id="reset-btn" type="button">Reset</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
